services:
  - type: web
    name: account-management-app
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: account_management_db
          property: connectionString
      - key: ENCRYPTION_KEY
        sync: false # User must set this manually in the dashboard

databases:
  - name: account_management_db
    plan: free
