services:
  - type: web
    name: account-management-app
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: account_management_db
          property: connectionString
      - key: ENCRYPTION_KEY
        # User has manually set this in the dashboard; keeping here for Blueprint consistency.

databases:
  - name: account_management_db
    plan: free
