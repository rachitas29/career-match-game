services:
  - type: web
    name: account-management-app
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: account_management_db
          property: connectionString
      - key: ENCRYPTION_KEY
        generateValue: true # This will generate a random key if not set, or we can use a fixed one.
        # Actually, let's use sync: false so the user can set it or we can manually add it.
        # For security, I'll just add the key entry.

databases:
  - name: account_management_db
    plan: free
