<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - My CRM</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="layout-wrapper">
        <aside class="sidebar">
            <div class="sidebar-logo">My CRM</div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">Dashboard</a>
                <a href="accounts.html" class="nav-item">Accounts</a>
                <a href="purchase-order-report.html" class="nav-item">PO Report</a>
                <a href="contacts.html" class="nav-item">Contacts</a>
                <a href="leads.html" class="nav-item">Leads</a>
                <a href="tasks.html" class="nav-item">Tasks</a>
                <a href="products.html" class="nav-item active">Products</a>
                <a href="settings.html" class="nav-item">Settings</a>
            </nav>
            <button onclick="api.logout()" class="nav-item"
                style="background: none; border: none; text-align: left; margin-top: auto; color: #f87171; cursor: pointer;">
                Logout
            </button>
        </aside>

        <main class="main-content">
            <div class="dashboard-container">
                <div class="dashboard-header">
                    <div>
                        <h1>Products</h1>
                        <p>Your product and service catalog.</p>
                    </div>
                    <div>
                        <a href="new-product.html" class="btn btn-primary">+ New Product</a>
                    </div>
                </div>

                <div class="card" style="max-width: 100%;">
                    <div id="productList" class="customer-list"
                        style="grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));">
                        <p>Loading products...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script>
        api.checkAuth();

        async function loadProducts() {
            const list = document.getElementById('productList');
            const result = await api.get('/products');

            if (result.error) {
                list.innerHTML = `<p style="color: var(--error)">Error: ${result.error}</p>`;
                return;
            }

            if (result.products.length === 0) {
                list.innerHTML = '<p>No products found.</p>';
                return;
            }

            list.innerHTML = result.products.map(p => `
                <div class="card" style="margin: 0; display: flex; flex-direction: column; height: 100%;">
                    <h3 style="margin-top: 0;">${p.name}</h3>
                    <p style="color: var(--text-muted); font-size: 0.9rem; flex: 1;">${p.description || 'No description'}</p>
                    <div style="margin-top: 1rem; display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-weight: 700; font-size: 1.25rem;">$${p.price}</span>
                        <span style="font-size: 0.8rem; background: #f1f5f9; padding: 0.25rem 0.5rem; border-radius: 4px;">${p.sku || 'No SKU'}</span>
                    </div>
                </div>
            `).join('');
        }

        loadProducts();
    </script>
</body>

</html>
