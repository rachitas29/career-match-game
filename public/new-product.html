<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Product - My CRM</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .form-grid>div {
            margin-bottom: 0.5rem;
        }
    </style>
</head>

<body>
    <div class="layout-wrapper">
        <aside class="sidebar">
            <div class="sidebar-logo">My CRM</div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">Dashboard</a>
                <a href="accounts.html" class="nav-item">Accounts</a>
                <a href="contacts.html" class="nav-item">Contacts</a>
                <a href="leads.html" class="nav-item">Leads</a>
                <a href="tasks.html" class="nav-item">Tasks</a>
                <a href="products.html" class="nav-item active">Products</a>
                <a href="settings.html" class="nav-item">Settings</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="dashboard-container" style="max-width: 800px;">
                <div style="margin-bottom: 1rem;">
                    <a href="products.html" style="color: var(--text-muted); font-size: 0.9rem;">&larr; Back to
                        Products</a>
                </div>

                <div class="page-title-bar">
                    <h1 style="color: var(--primary-dark); margin: 0; font-size: 1.8rem; font-weight: 700;">New Product
                    </h1>
                    <p style="color: var(--text-muted); margin-top: 0.5rem;">Add to your catalog.</p>
                </div>

                <form id="productForm" class="form-grid">
                    <div class="col-span-8">
                        <label>Product Name</label>
                        <input type="text" id="name" required placeholder="Premium Service">
                    </div>
                    <div class="col-span-4">
                        <label>SKU / Code</label>
                        <input type="text" id="sku" placeholder="PRD-001">
                    </div>

                    <div class="col-span-4">
                        <label>Price ($)</label>
                        <input type="number" step="0.01" id="price" required placeholder="99.00">
                    </div>
                    <div class="col-span-8"></div> <!-- Spacer -->

                    <div class="col-span-12">
                        <label>Description</label>
                        <textarea id="description" rows="3" placeholder="Description..."></textarea>
                    </div>

                    <div class="col-span-12" style="margin-top: 1rem;">
                        <button type="submit" class="btn btn-primary">Create Product</button>
                    </div>
                </form>
                <div id="statusMsg" style="margin-top: 1rem; text-align: center; display: none;"></div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script>
        api.checkAuth();

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const getVal = (id) => document.getElementById(id).value;
            const user = api.getCurrentUser();

            const data = {
                user_id: user.id,
                name: getVal('name'),
                sku: getVal('sku'),
                price: getVal('price'),
                description: getVal('description')
            };

            const result = await api.post('/products', data);
            const statusMsg = document.getElementById('statusMsg');

            if (result.error) {
                statusMsg.textContent = result.error;
                statusMsg.style.color = 'var(--error)';
            } else {
                statusMsg.textContent = 'Product Created!';
                statusMsg.style.color = 'var(--success)';
                setTimeout(() => window.location.href = 'products.html', 1000);
            }
            statusMsg.style.display = 'block';
        });
    </script>
</body>

</html>
