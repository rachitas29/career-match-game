<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Password Recovery - Account Flow</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            background-image:
                radial-gradient(at 0% 0%, hsla(253, 16%, 7%, 1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(225, 39%, 30%, 1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339, 49%, 30%, 1) 0, transparent 50%);
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Outfit', sans-serif;
            color: #1e293b;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 2.5rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.5);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand-logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-logo h1 {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4f46e5 0%, #ec4899 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            margin: 0;
        }

        .form-section-title {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin: 1.5rem 0 1rem 0;
            display: flex;
            align-items: center;
        }

        .form-section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e2e8f0;
            margin-left: 10px;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-weight: 500;
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
            color: #475569;
        }

        .form-input {
            width: 100%;
            padding: 0.65rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.95rem;
            transition: all 0.2s;
            font-family: inherit;
        }

        .form-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 0.875rem;
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1.5rem;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .sub-links {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: #64748b;
        }

        .sub-links a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 500;
        }

        .sub-links a:hover {
            text-decoration: underline;
        }

        .info-tip {
            background: #eff6ff;
            color: #1e40af;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.8rem;
            margin-bottom: 1.5rem;
            border: 1px solid #dbeafe;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="brand-logo">
            <h1>Account Flow</h1>
            <p style="color: #64748b; margin-top: 0.5rem; font-size: 0.95rem;">Secure Password Retrieval</p>
        </div>

        <div class="info-tip">
            <strong>Security Note:</strong> Your original password will be decrypted and sent to your registered email
            address using the secure SendGrid API.
        </div>

        <form id="forgotForm">
            <div class="form-section-title">Recipient</div>
            <div class="form-group">
                <label class="form-label" for="targetEmail">Registered Email to Recover</label>
                <input type="email" id="targetEmail" class="form-input" required placeholder="user@company.com">
            </div>

            <div id="statusMsg"
                style="padding: 0.75rem; border-radius: 8px; font-size: 0.9rem; margin-bottom: 1rem; display: none; line-height: 1.4;">
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">Retrieve & Send Password</button>
        </form>

        <div class="sub-links">
            <a href="login.html">Back to Login</a>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        const form = document.getElementById('forgotForm');
        const statusMsg = document.getElementById('statusMsg');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            statusMsg.style.display = 'none';
            submitBtn.innerHTML = 'Decrypting & Sending...';
            submitBtn.disabled = true;

            const targetEmail = document.getElementById('targetEmail').value;

            try {
                const result = await api.post('/forgot-password', {
                    targetEmail
                });

                if (result.error) {
                    statusMsg.textContent = result.error;
                    statusMsg.style.background = '#fef2f2';
                    statusMsg.style.color = '#dc2626';
                    statusMsg.style.border = '1px solid #fee2e2';
                    statusMsg.style.display = 'block';
                } else {
                    statusMsg.textContent = result.message;
                    statusMsg.style.background = '#f0fdf4';
                    statusMsg.style.color = '#16a34a';
                    statusMsg.style.border = '1px solid #dcfce7';
                    statusMsg.style.display = 'block';
                    statusMsg.style.display = 'block';
                }
            } catch (err) {
                statusMsg.textContent = 'Network error occurred. Ensure the local server is running.';
                statusMsg.style.background = '#fef2f2';
                statusMsg.style.color = '#dc2626';
                statusMsg.style.display = 'block';
            } finally {
                submitBtn.innerHTML = 'Retrieve & Send Password';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
