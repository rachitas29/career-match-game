<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Account Flow</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="center-screen">
        <div class="card">
            <h1>Reset Password</h1>
            <p>Enter your email to receive reset instructions.</p>

            <form id="resetForm">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="you@example.com">
                </div>

                <div id="message" style="margin-bottom: 1rem; display: none;"></div>

                <button type="submit" class="btn btn-primary">Send Reset Link</button>
            </form>

            <p style="margin-top: 1.5rem; text-align: center;">
                <a href="login.html">Back to Sign In</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('resetForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const msg = document.getElementById('message');
            msg.textContent = 'If an account exists, a reset link has been sent.';
            msg.style.color = 'var(--success)';
            msg.style.display = 'block';
            // Logic would go here in real app
        });
    </script>
</body>

</html>
