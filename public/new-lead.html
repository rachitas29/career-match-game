<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Lead - My CRM</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .form-grid>div {
            margin-bottom: 0.5rem;
        }
    </style>
</head>

<body>
    <div class="layout-wrapper">
        <aside class="sidebar">
            <div class="sidebar-logo">My CRM</div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">Dashboard</a>
                <a href="accounts.html" class="nav-item">Accounts</a>
                <a href="contacts.html" class="nav-item">Contacts</a>
                <a href="leads.html" class="nav-item active">Leads</a>
                <a href="tasks.html" class="nav-item">Tasks</a>
                <a href="products.html" class="nav-item">Products</a>
                <a href="settings.html" class="nav-item">Settings</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="dashboard-container" style="max-width: 800px;">
                <div style="margin-bottom: 1rem;">
                    <a href="leads.html" style="color: var(--text-muted); font-size: 0.9rem;">&larr; Back to Leads</a>
                </div>

                <div class="page-title-bar">
                    <h1 style="color: var(--primary-dark); margin: 0; font-size: 1.8rem; font-weight: 700;">New Lead
                    </h1>
                    <p style="color: var(--text-muted); margin-top: 0.5rem;">Capture a new business opportunity.</p>
                </div>

                <form id="leadForm" class="form-grid">
                    <div class="col-span-6">
                        <label>Lead Name</label>
                        <input type="text" id="name" required placeholder="Jane Smith">
                    </div>
                    <div class="col-span-6">
                        <label>Company / Organization</label>
                        <input type="text" id="company_name" placeholder="Acme Corp">
                    </div>

                    <div class="col-span-6">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="jane@example.com">
                    </div>
                    <div class="col-span-6">
                        <label>Estimated Value ($)</label>
                        <input type="number" id="value" placeholder="1000">
                    </div>

                    <div class="col-span-12">
                        <label>Status</label>
                        <select id="status">
                            <option value="New" selected>New</option>
                            <option value="Contacted">Contacted</option>
                            <option value="Qualified">Qualified</option>
                            <option value="Won">Won</option>
                            <option value="Lost">Lost</option>
                        </select>
                    </div>

                    <div class="col-span-12" style="margin-top: 1rem;">
                        <button type="submit" class="btn btn-primary">Create Lead</button>
                    </div>
                </form>
                <div id="statusMsg" style="margin-top: 1rem; text-align: center; display: none;"></div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script>
        api.checkAuth();

        document.getElementById('leadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const getVal = (id) => document.getElementById(id).value;
            const user = api.getCurrentUser();

            const data = {
                user_id: user.id,
                name: getVal('name'),
                company_name: getVal('company_name'),
                email: getVal('email'),
                value: getVal('value'),
                status: getVal('status')
            };

            const result = await api.post('/leads', data);
            const statusMsg = document.getElementById('statusMsg');

            if (result.error) {
                statusMsg.textContent = result.error;
                statusMsg.style.color = 'var(--error)';
            } else {
                statusMsg.textContent = 'Lead Created!';
                statusMsg.style.color = 'var(--success)';
                setTimeout(() => window.location.href = 'leads.html', 1000);
            }
            statusMsg.style.display = 'block';
        });
    </script>
</body>

</html>
