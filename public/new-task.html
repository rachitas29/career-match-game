<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Task - My CRM</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .form-grid>div {
            margin-bottom: 0.5rem;
        }
    </style>
</head>

<body>
    <div class="layout-wrapper">
        <aside class="sidebar">
            <div class="sidebar-logo">My CRM</div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">Dashboard</a>
                <a href="accounts.html" class="nav-item">Accounts</a>
                <a href="contacts.html" class="nav-item">Contacts</a>
                <a href="leads.html" class="nav-item">Leads</a>
                <a href="tasks.html" class="nav-item active">Tasks</a>
                <a href="products.html" class="nav-item">Products</a>
                <a href="settings.html" class="nav-item">Settings</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="dashboard-container" style="max-width: 800px;">
                <div style="margin-bottom: 1rem;">
                    <a href="tasks.html" style="color: var(--text-muted); font-size: 0.9rem;">&larr; Back to Tasks</a>
                </div>

                <div class="page-title-bar">
                    <h1 style="color: var(--primary-dark); margin: 0; font-size: 1.8rem; font-weight: 700;">New Task
                    </h1>
                    <p style="color: var(--text-muted); margin-top: 0.5rem;">Schedule an activity.</p>
                </div>

                <form id="taskForm" class="form-grid">
                    <div class="col-span-12">
                        <label>Related Account (Optional)</label>
                        <select id="account_id">
                            <option value="">None (Personal Task)</option>
                        </select>
                    </div>

                    <div class="col-span-8">
                        <label>Task Title</label>
                        <input type="text" id="title" required placeholder="Follow up call">
                    </div>
                    <div class="col-span-4">
                        <label>Type</label>
                        <select id="type">
                            <option value="Call">Call</option>
                            <option value="Meeting">Meeting</option>
                            <option value="To-Do">To-Do</option>
                            <option value="Email">Email</option>
                        </select>
                    </div>

                    <div class="col-span-6">
                        <label>Due Date</label>
                        <input type="date" id="due_date">
                    </div>

                    <div class="col-span-12">
                        <label>Description</label>
                        <textarea id="description" rows="3" placeholder="Details..."></textarea>
                    </div>

                    <div class="col-span-12" style="margin-top: 1rem;">
                        <button type="submit" class="btn btn-primary">Create Task</button>
                    </div>
                </form>
                <div id="statusMsg" style="margin-top: 1rem; text-align: center; display: none;"></div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script>
        api.checkAuth();

        async function loadAccounts() {
            const result = await api.get('/customers');
            if (result.customers) {
                const select = document.getElementById('account_id');
                result.customers.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    opt.textContent = c.customer_name;
                    select.appendChild(opt);
                });
            }
        }
        loadAccounts();

        document.getElementById('taskForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const getVal = (id) => document.getElementById(id).value;
            const user = api.getCurrentUser();

            const data = {
                user_id: user.id,
                account_id: getVal('account_id') || null,
                title: getVal('title'),
                type: getVal('type'),
                due_date: getVal('due_date'),
                description: getVal('description')
            };

            const result = await api.post('/tasks', data);
            const statusMsg = document.getElementById('statusMsg');

            if (result.error) {
                statusMsg.textContent = result.error;
                statusMsg.style.color = 'var(--error)';
            } else {
                statusMsg.textContent = 'Task Created!';
                statusMsg.style.color = 'var(--success)';
                setTimeout(() => window.location.href = 'tasks.html', 1000);
            }
            statusMsg.style.display = 'block';
        });
    </script>
</body>

</html>
